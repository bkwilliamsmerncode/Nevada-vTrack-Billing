name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment: github-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify configuration and build website
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ vars.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ vars.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ vars.VITE_EMAILJS_PUBLIC_KEY }}
        run: |
          test -n "$VITE_EMAILJS_SERVICE_ID" || { echo "::error::Missing VITE_EMAILJS_SERVICE_ID variable"; exit 1; }
          test -n "$VITE_EMAILJS_TEMPLATE_ID" || { echo "::error::Missing VITE_EMAILJS_TEMPLATE_ID variable"; exit 1; }
          test -n "$VITE_EMAILJS_PUBLIC_KEY" || { echo "::error::Missing VITE_EMAILJS_PUBLIC_KEY variable"; exit 1; }

          echo "All EmailJS configuration values are present."
          npm run build

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4